openapi: 3.0.3
info:
  title: Task API
  description: OpenAPI 3.0 に準拠したシンプルなRESTful APIサンプル
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: ローカル開発環境
paths:
  /tasks:
    get:
      summary: タスク一覧取得
      operationId: getTasks
      responses:
        '200':
          description: タスク一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: タスク作成
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: 作成されたタスク
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: バリデーションエラー
  /tasks/{id}:
    get:
      summary: タスク詳細取得
      operationId: getTaskById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: タスク詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: タスクが見つからない
    delete:
      summary: タスク削除
      operationId: deleteTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: 削除成功
        '404':
          description: タスクが見つからない
components:
  schemas:
    Task:
      type: object
      required: [id, title, done]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: 買い物に行く
        done:
          type: boolean
          example: false
    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          example: レポートを書く
        done:
          type: boolean
          default: false
